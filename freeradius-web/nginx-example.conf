# Contoh nginx untuk freeradius-web (SvelteKit adapter-node).
# Frontend proxy /api/* ke Go backend sendiri, jadi nginx cukup teruskan
# semuanya ke Node dan menitipkan X-Forwarded-Proto agar CSRF check lolos.
#
# Pasangan env di .env frontend:
#   PORT=5173
#   ORIGIN=https://radius.example.com   (atau http://... bila tanpa TLS)
#   PROTOCOL_HEADER=x-forwarded-proto

upstream freeradius_web {
    server 127.0.0.1:5173;
}

server {
    listen 80;
    server_name radius.example.com;

    # Redirect ke HTTPS bila sertifikat tersedia (disarankan karena cookie sesi)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://freeradius_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
