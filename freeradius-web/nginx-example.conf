# Contoh nginx untuk minimalFreeRadius: satu upstream backend Go :3000
# yang men-serve API (/api/*) + panel web statis (/).
#
# Backend dijalankan mis. dengan:
#   WEB_DIR=/opt/freeradius-web ./freeradius-api   (hasil `npm run build`)

upstream freeradius {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name radius.example.com;

    # Redirect ke HTTPS bila sertifikat tersedia (disarankan karena cookie sesi)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://freeradius;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
